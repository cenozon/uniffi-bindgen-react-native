name: 'Cenozon: Publish @cenozon/* napi runtime + bindgen to GHCR'

# Snapshot-publish workflow for the cenozon fork.
#
# Trigger model:
#   - workflow_dispatch only. The user manually clicks "Run workflow"
#     (or runs `gh workflow run ...`) against whichever branch they want
#     to publish. The workflow derives a unique prerelease snapshot
#     version from the sanitised branch name + short HEAD SHA so each
#     dispatch produces an identifiable build.
#
# Explicitly NOT triggered on push, pull_request, or tags — this branch
# is a permanent feature branch that won't be merged, and every publish
# is a deliberate user action.

on:
  workflow_dispatch:
    inputs:
      version-base:
        description: 'Base version to embed in the snapshot (defaults to runtimes/napi/package.json version stem).'
        type: string
        required: false
        default: ''

permissions:
  contents: read
  packages: write

concurrency:
  group: cenozon-ghcr-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Scope and registry for the cenozon GitHub Packages npm registry.
  CENOZON_SCOPE: '@cenozon'
  CENOZON_REGISTRY: 'https://npm.pkg.github.com'
  # Upstream package names that we rename at workflow time.
  # Upstream renamed `@uniffi-runtime/napi` → `@ubjs/node` in #396 (May 2026);
  # everything downstream of `napi create-npm-dir` and the generated index.js
  # now references `@ubjs/node-<triple>` instead of `@uniffi-runtime/napi-<triple>`.
  UPSTREAM_RUNTIME_SCOPE: '@ubjs/node'
  UPSTREAM_BINDGEN_NAME: 'uniffi-bindgen-react-native'
  CENOZON_RUNTIME_NAME: '@cenozon/uniffi-runtime-napi'
  CENOZON_BINDGEN_NAME: '@cenozon/uniffi-bindgen-react-native'

jobs:
  prepare:
    name: Compute snapshot version
    runs-on: ubuntu-latest
    outputs:
      snapshot-version: ${{ steps.compute.outputs.snapshot-version }}
      short-sha: ${{ steps.compute.outputs.short-sha }}
      sanitised-branch: ${{ steps.compute.outputs.sanitised-branch }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute snapshot version
        id: compute
        run: |
          set -euo pipefail

          # The dispatched ref (branch the user clicked "Run workflow" on)
          # and its HEAD SHA at the time of dispatch.
          BRANCH="${{ github.ref_name }}"
          SHA="${{ github.sha }}"

          # Sanitise the branch: strip the `dev/<user>/` prefix, then replace
          # any remaining non [A-Za-z0-9-] with `-` so the result is a
          # legal semver prerelease identifier.
          SANITISED="$(echo "$BRANCH" | sed -E 's#dev/[A-Za-z0-9_.-]+/##g' | sed -E 's#[^A-Za-z0-9-]+#-#g' | sed -E 's#^-+|-+$##g')"
          if [ -z "$SANITISED" ]; then
            SANITISED="snapshot"
          fi

          # Prefix the short SHA with `g` (matching `git describe --abbrev=N`
          # convention) so the resulting identifier is alphanumeric. Semver
          # rejects leading zeros in all-digit pre-release identifiers,
          # which intermittently breaks the snapshot version when the SHA
          # happens to be all digits (e.g. `0875417`).
          SHORT_SHA="g$(echo "$SHA" | cut -c1-7)"

          # Base version: either the dispatch input, or the stem of the
          # current runtimes/napi/package.json version (everything before
          # the first `-`).
          DISPATCH_BASE="${{ inputs.version-base }}"
          if [ -n "$DISPATCH_BASE" ]; then
            BASE="$DISPATCH_BASE"
          else
            BASE="$(node -e "console.log(require('./runtimes/napi/package.json').version.split('-')[0])")"
          fi

          SNAPSHOT="${BASE}-${SANITISED}.${SHORT_SHA}"

          echo "snapshot-version=${SNAPSHOT}" >> "$GITHUB_OUTPUT"
          echo "short-sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "sanitised-branch=${SANITISED}" >> "$GITHUB_OUTPUT"

          {
            echo "## Cenozon snapshot publish"
            echo ""
            echo "- Branch: \`${BRANCH}\`"
            echo "- Sanitised branch: \`${SANITISED}\`"
            echo "- Short SHA: \`${SHORT_SHA}\`"
            echo "- Base version: \`${BASE}\`"
            echo "- Snapshot version: \`${SNAPSHOT}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux GNU x64 — native on the standard ubuntu runner.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            build-flags: ''
          # Linux GNU arm64 — native on GitHub-hosted ARM runner.
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            build-flags: ''
          # Windows MSVC x64 — native on windows-latest.
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            build-flags: ''
          # Windows MSVC arm64 — native on Windows-on-ARM. GitHub-hosted
          # `windows-11-arm` runner; no cross-compile dance.
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            build-flags: ''
          # macOS arm64 — native on Apple Silicon.
          - target: aarch64-apple-darwin
            runner: macos-latest
            build-flags: ''
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: runtimes/napi
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build native module
        # NB: --js-package-name is honoured by napi when it generates
        # index.js, but the publish job runs on a fresh checkout where
        # index.js is sourced from the committed tree, not from this
        # build. We sed-rewrite the scope in the publish step instead;
        # passing --js-package-name here is harmless but not required
        # for the published loader to be correct.
        run: npm run build -- --target ${{ matrix.target }} ${{ matrix.build-flags }} --js-package-name ${{ env.CENOZON_RUNTIME_NAME }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cenozon-napi-${{ matrix.target }}
          path: runtimes/napi/uniffi-runtime-napi.*.node
          if-no-files-found: error

      # Bump the ubrn_cli crate version to the snapshot version
      # BEFORE building. The binary embeds `env!("CARGO_PKG_VERSION")`
      # via `ubrn_version()` (crates/ubrn_cli/src/config/mod.rs) and
      # that value is what gets stamped into the generated podspec's
      # `s.dependency "uniffi-bindgen-react-native", "<version>"` line
      # in downstream consumers. The published npm/pod is the snapshot
      # version, so the binary must report the same value or
      # `pod install` rejects the dependency. `--locked` is dropped
      # from the cargo build below because this edit invalidates
      # Cargo.lock's checksum for the ubrn_cli package.
      - name: Stamp ubrn_cli crate version to snapshot
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          SNAPSHOT_VERSION: ${{ needs.prepare.outputs.snapshot-version }}
        run: |
          set -euo pipefail
          node <<'EOF'
          const fs = require('node:fs');
          const p = 'crates/ubrn_cli/Cargo.toml';
          const version = process.env.SNAPSHOT_VERSION;
          if (!version) throw new Error('SNAPSHOT_VERSION not set');
          let txt = fs.readFileSync(p, 'utf8');
          const before = txt;
          // Match the first `version = "..."` after `name = "uniffi-bindgen-react-native"`
          // in the [package] table. The crate has exactly one `[package]`
          // section at the top, so a non-greedy match between `name = ...`
          // and the next `version = "..."` is unambiguous.
          txt = txt.replace(
            /(name\s*=\s*"uniffi-bindgen-react-native"\s*\nversion\s*=\s*)"[^"]+"/,
            `$1"${version}"`,
          );
          if (txt === before) {
            throw new Error('Failed to rewrite version in ' + p + ' — package table layout changed');
          }
          fs.writeFileSync(p, txt);
          console.log(`Stamped ${p} version=${version}`);
          EOF

      # Build the uniffi-bindgen-react-native CLI binary for this same
      # target so consumers don't need a Rust toolchain to install the
      # bindgen. The crate lives at crates/ubrn_cli/ and its [[bin]]
      # name is uniffi-bindgen-react-native; the binary lands at
      # target/<triple>/release/uniffi-bindgen-react-native[.exe].
      - name: Build uniffi-bindgen-react-native CLI binary
        working-directory: ${{ github.workspace }}
        run: cargo build --release --bin uniffi-bindgen-react-native --target ${{ matrix.target }}

      - name: Upload CLI binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: cenozon-cli-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/uniffi-bindgen-react-native
            target/${{ matrix.target }}/release/uniffi-bindgen-react-native.exe
          if-no-files-found: error

  publish:
    name: Publish to GHCR
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Auth + scope for npm publish. NODE_AUTH_TOKEN comes from the
      # workflow's own GITHUB_TOKEN which has packages:write per the
      # workflow-level permissions block above.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: ${{ env.CENOZON_REGISTRY }}
          scope: ${{ env.CENOZON_SCOPE }}
          always-auth: true

      - name: Install runtime dependencies
        working-directory: runtimes/napi
        run: npm ci --ignore-scripts

      # Restrict the napi platform set to our 5 targets BEFORE running
      # `napi create-npm-dir` and before re-renaming. This is a
      # workflow-only transform — never committed back to the tree.
      - name: Restrict napi triples to cenozon target set
        working-directory: runtimes/napi
        run: |
          node <<'EOF'
          const fs = require('node:fs');
          const path = './package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.napi = pkg.napi || {};
          pkg.napi.triples = {
            defaults: false,
            additional: [
              'x86_64-unknown-linux-gnu',
              'aarch64-unknown-linux-gnu',
              'x86_64-pc-windows-msvc',
              'aarch64-pc-windows-msvc',
              'aarch64-apple-darwin',
            ],
          };
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          EOF

      - name: Create per-platform npm package directories
        working-directory: runtimes/napi
        run: npm run create-npm-dirs

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: runtimes/napi/artifacts
          pattern: cenozon-napi-*
          merge-multiple: true

      - name: Move artifacts into platform dirs
        working-directory: runtimes/napi
        run: npm run artifacts

      - name: Build TypeScript helpers (resolve-lib)
        working-directory: runtimes/napi
        run: npm run build:ts

      - name: Assemble root package
        working-directory: runtimes/napi
        run: npm run assemble-root

      # Workflow-time rename of every package:
      #   - npm/<triple>/package.json: name → @cenozon/uniffi-runtime-napi-<triple>
      #   - npm/root/package.json: name → @cenozon/uniffi-runtime-napi,
      #     optionalDependencies remapped to @cenozon/* scope.
      # All sub-packages get pinned to the snapshot version.
      - name: Rewrite napi runtime packages to @cenozon scope
        working-directory: runtimes/napi
        env:
          SNAPSHOT_VERSION: ${{ needs.prepare.outputs.snapshot-version }}
        run: |
          node <<'EOF'
          const fs = require('node:fs');
          const path = require('node:path');
          const version = process.env.SNAPSHOT_VERSION;
          if (!version) throw new Error('SNAPSHOT_VERSION not set');

          const npmDir = path.resolve('npm');
          const entries = fs.readdirSync(npmDir);

          for (const name of entries) {
            const pkgPath = path.join(npmDir, name, 'package.json');
            if (!fs.existsSync(pkgPath)) continue;
            const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));

            if (name === 'root') {
              pkg.name = '@cenozon/uniffi-runtime-napi';
              if (pkg.optionalDependencies) {
                const next = {};
                for (const [k, v] of Object.entries(pkg.optionalDependencies)) {
                  // Rewrite @ubjs/node-<triple> → @cenozon/uniffi-runtime-napi-<triple>.
                  const triple = k.replace(/^@ubjs\/node-/, '');
                  next[`@cenozon/uniffi-runtime-napi-${triple}`] = version;
                }
                pkg.optionalDependencies = next;
              }
            } else {
              // Platform sub-package: name is `@ubjs/node-<triple>`.
              pkg.name = `@cenozon/uniffi-runtime-napi-${name}`;
            }
            pkg.version = version;
            // GHCR-friendly publishConfig: explicit registry + restricted access
            // (private repo packages cannot be public on GHCR).
            pkg.publishConfig = {
              registry: 'https://npm.pkg.github.com',
              access: 'restricted',
            };
            // Drop any provenance-related publishConfig keys leftover from upstream.
            fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');
            console.log(`Rewrote ${pkgPath}: name=${pkg.name} version=${pkg.version}`);
          }

          // assemble-root.mjs already copied index.js into npm/root/.
          // Rewrite its require('@ubjs/node-<triple>') calls to point at
          // our scope. Done as a string replace because the file is
          // generated by napi-rs and only references the scope through
          // these literal require() strings.
          const rootIndexPath = path.join(npmDir, 'root', 'index.js');
          if (fs.existsSync(rootIndexPath)) {
            let txt = fs.readFileSync(rootIndexPath, 'utf8');
            const before = txt;
            txt = txt.replace(/@ubjs\/node-/g, '@cenozon/uniffi-runtime-napi-');
            if (txt === before) {
              console.warn('WARN: no @ubjs/node- references found in root/index.js');
            }
            fs.writeFileSync(rootIndexPath, txt);
          } else {
            throw new Error(`Missing ${rootIndexPath} — assemble-root did not copy index.js`);
          }
          EOF

      # Sanity-check: the published root package must only reference our
      # scope at require() time.
      - name: Verify root index.js references @cenozon scope only
        working-directory: runtimes/napi
        run: |
          set -euo pipefail
          if grep -q "@ubjs/node-" npm/root/index.js; then
            echo "ERROR: root/index.js still references @ubjs/node-* after rewrite."
            grep -n "@ubjs/node-" npm/root/index.js | head
            exit 1
          fi
          if ! grep -q "@cenozon/uniffi-runtime-napi-" npm/root/index.js; then
            echo "ERROR: root/index.js does not reference @cenozon/uniffi-runtime-napi-*."
            exit 1
          fi
          echo "OK: index.js loader references @cenozon/uniffi-runtime-napi-*"

      # Build the bindgen TS helper package under its renamed name.
      - name: Build uniffi-bindgen-react-native TS
        run: |
          npm install --ignore-scripts --no-fund --no-audit
          ./node_modules/.bin/tsc

      # Download all 5 per-triple CLI binaries built by the matrix into
      # one tree, then stage each into its own publishable npm package
      # at dist-cenozon-cli/<napi-triple>/.
      - name: Download CLI binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: cli-artifacts
          pattern: cenozon-cli-*

      - name: Stage CLI platform sub-packages
        env:
          SNAPSHOT_VERSION: ${{ needs.prepare.outputs.snapshot-version }}
        run: |
          set -euo pipefail
          node - <<'EOF'
          const fs = require('node:fs');
          const path = require('node:path');
          const { execSync } = require('node:child_process');

          const version = process.env.SNAPSHOT_VERSION;
          if (!version) throw new Error('SNAPSHOT_VERSION not set');

          // Cargo target triple -> napi-rs triple convention used everywhere
          // else in the workflow (and matched by the umbrella's runtime
          // resolution map).
          const TARGETS = [
            { cargo: 'x86_64-unknown-linux-gnu',  napi: 'linux-x64-gnu',    os: 'linux',  cpu: 'x64',   exe: 'uniffi-bindgen-react-native' },
            { cargo: 'aarch64-unknown-linux-gnu', napi: 'linux-arm64-gnu',  os: 'linux',  cpu: 'arm64', exe: 'uniffi-bindgen-react-native' },
            { cargo: 'x86_64-pc-windows-msvc',    napi: 'win32-x64-msvc',   os: 'win32',  cpu: 'x64',   exe: 'uniffi-bindgen-react-native.exe' },
            { cargo: 'aarch64-pc-windows-msvc',   napi: 'win32-arm64-msvc', os: 'win32',  cpu: 'arm64', exe: 'uniffi-bindgen-react-native.exe' },
            { cargo: 'aarch64-apple-darwin',      napi: 'darwin-arm64',     os: 'darwin', cpu: 'arm64', exe: 'uniffi-bindgen-react-native' },
          ];

          const stageRoot = path.resolve('dist-cenozon-cli');
          fs.rmSync(stageRoot, { recursive: true, force: true });
          fs.mkdirSync(stageRoot, { recursive: true });

          for (const t of TARGETS) {
            const srcArtifactDir = path.resolve('cli-artifacts', `cenozon-cli-${t.cargo}`);
            const srcExe = path.join(srcArtifactDir, t.exe);
            if (!fs.existsSync(srcExe)) {
              throw new Error(`Expected CLI binary not found: ${srcExe}`);
            }

            const stageDir = path.join(stageRoot, t.napi);
            const stageBin = path.join(stageDir, 'bin');
            fs.mkdirSync(stageBin, { recursive: true });
            const dstExe = path.join(stageBin, t.exe);
            fs.copyFileSync(srcExe, dstExe);
            if (t.os !== 'win32') {
              fs.chmodSync(dstExe, 0o755);
            }

            const pkg = {
              name: `@cenozon/uniffi-bindgen-react-native-cli-${t.napi}`,
              version,
              description: `Prebuilt uniffi-bindgen-react-native CLI for ${t.napi}`,
              license: 'MPL-2.0',
              bin: {
                [`uniffi-bindgen-react-native-cli-${t.napi}`]: `./bin/${t.exe}`,
              },
              os: [t.os],
              cpu: [t.cpu],
              files: ['bin/'],
              publishConfig: {
                registry: 'https://npm.pkg.github.com',
                access: 'restricted',
              },
            };
            fs.writeFileSync(path.join(stageDir, 'package.json'), JSON.stringify(pkg, null, 2) + '\n');
            console.log(`Staged ${pkg.name}@${version} -> ${stageDir}`);
          }
          EOF

      - name: List staged CLI sub-packages
        run: |
          echo "--- dist-cenozon-cli/* ---"
          ls -la dist-cenozon-cli/
          for d in dist-cenozon-cli/*/; do
            echo "--- $d ---"
            ls -la "$d"
            cat "$d/package.json"
            echo ""
          done

      - name: Publish CLI platform sub-packages
        working-directory: dist-cenozon-cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for dir in */; do
            echo "--- npm publish $dir (tag=snapshot) ---"
            (cd "$dir" && npm publish --tag snapshot --access restricted)
          done

      # Rewrite bin/cli.cjs IN PLACE in the source tree. Upstream's
      # cli.cjs does `cargo run` against the source crate, which doesn't
      # work for installed consumers. We replace it with a resolver shim
      # that finds the matching @cenozon/uniffi-bindgen-react-native-cli-*
      # sub-package (delivered via optionalDependencies below) and execs
      # its prebuilt binary.
      #
      # Done via Node so we don't have to fight bash heredoc indentation
      # inside a YAML literal block. Edits to the runner's working tree
      # are ephemeral — never committed back.
      - name: Rewrite bin/cli.cjs as platform-resolver shim
        run: |
          set -euo pipefail
          node - "bin/cli.cjs" <<'EOF'
          const fs = require('node:fs');
          const out = process.argv[2];
          const content = [
            "#!/usr/bin/env node",
            "const { spawnSync } = require('node:child_process');",
            "const PLATFORM_TO_TRIPLE = {",
            "  'linux-x64': 'linux-x64-gnu',",
            "  'linux-arm64': 'linux-arm64-gnu',",
            "  'win32-x64': 'win32-x64-msvc',",
            "  'win32-arm64': 'win32-arm64-msvc',",
            "  'darwin-arm64': 'darwin-arm64',",
            "};",
            "const key = `${process.platform}-${process.arch}`;",
            "const triple = PLATFORM_TO_TRIPLE[key];",
            "if (!triple) {",
            "  console.error(`Unsupported platform: ${key}. Supported: ${Object.keys(PLATFORM_TO_TRIPLE).join(', ')}`);",
            "  process.exit(1);",
            "}",
            "const subpkg = `@cenozon/uniffi-bindgen-react-native-cli-${triple}`;",
            "const exeName = process.platform === 'win32' ? 'uniffi-bindgen-react-native.exe' : 'uniffi-bindgen-react-native';",
            "let binPath;",
            "try { binPath = require.resolve(`${subpkg}/bin/${exeName}`); }",
            "catch (e) { console.error(`Could not resolve ${subpkg}. Is it installed? (${e.message})`); process.exit(1); }",
            "const res = spawnSync(binPath, process.argv.slice(2), { stdio: 'inherit' });",
            "process.exit(res.status ?? 1);",
            "",
          ].join('\n');
          fs.writeFileSync(out, content);
          fs.chmodSync(out, 0o755);
          console.log('Wrote', out);
          EOF

      # Edit the source package.json IN PLACE with only the cenozon-fork
      # changes layered on top:
      #   - name      → @cenozon/uniffi-bindgen-react-native
      #   - version   → SNAPSHOT_VERSION
      #   - optionalDependencies → 5-triple CLI sub-package pins
      #   - publishConfig → GHCR
      #
      # Crucially we do NOT add a `files:` array. The source package.json
      # has none, so `npm publish` falls back to "everything not in
      # .npmignore / .gitignore" — which matches what upstream's own
      # publish workflow does and ensures cpp/, *.podspec,
      # react-native.config.js (when present), typescript/dist/, bin/,
      # etc. all land in the tarball. The hand-curated `files:` array we
      # used to ship here is what kept silently dropping files; the
      # whole-tree-minus-ignores default is exactly what we want.
      - name: Rewrite source package.json for cenozon publish
        env:
          SNAPSHOT_VERSION: ${{ needs.prepare.outputs.snapshot-version }}
        run: |
          set -euo pipefail
          node <<'EOF'
          const fs = require('node:fs');
          const pkgPath = './package.json';
          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
          const version = process.env.SNAPSHOT_VERSION;
          if (!version) throw new Error('SNAPSHOT_VERSION not set');

          // Pin each per-triple CLI sub-package as an optionalDependency.
          // npm/bun honour the os/cpu constraints declared in the
          // sub-package's own package.json, so only the matching one
          // installs on a given host.
          const CLI_TRIPLES = [
            'linux-x64-gnu',
            'linux-arm64-gnu',
            'win32-x64-msvc',
            'win32-arm64-msvc',
            'darwin-arm64',
          ];
          const optionalDependencies = {};
          for (const t of CLI_TRIPLES) {
            optionalDependencies[`@cenozon/uniffi-bindgen-react-native-cli-${t}`] = version;
          }

          pkg.name = '@cenozon/uniffi-bindgen-react-native';
          pkg.version = version;
          pkg.optionalDependencies = optionalDependencies;
          pkg.publishConfig = {
            registry: 'https://npm.pkg.github.com',
            access: 'restricted',
          };

          fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');
          console.log(`Rewrote ${pkgPath}: name=${pkg.name} version=${pkg.version}`);
          EOF

      # The root podspec reads `s.name = package['name']` and
      # `s.version = package['version']`. After the rewrite above,
      # `package['name']` is `@cenozon/uniffi-bindgen-react-native` —
      # not a legal CocoaPods name (`@`/`/` are rejected by `pod spec
      # lint`) and would not match `s.dependency "uniffi-bindgen-react-native"`
      # in downstream consumers' podspecs (which is what ubrn-generated
      # turbomodule podspecs emit). CocoaPods identity is separate from
      # npm identity, so we hardcode the pod name back to the unscoped
      # `uniffi-bindgen-react-native` and let the dynamic version flow
      # through from the (already-rewritten) package.json.
      - name: Hardcode root podspec name back to unscoped
        run: |
          set -euo pipefail
          node <<'EOF'
          const fs = require('node:fs');
          const p = './uniffi-bindgen-react-native.podspec';
          let txt = fs.readFileSync(p, 'utf8');
          const before = txt;
          // Replace `s.name = package['name']` (or `s.name = package["name"]`)
          // with a hardcoded literal. Anchored on `s.name` to avoid
          // accidentally matching `s.summary = package['name']` etc.
          txt = txt.replace(
            /s\.name\s*=\s*package\[['"]name['"]\]/,
            `s.name             = 'uniffi-bindgen-react-native'`,
          );
          if (txt === before) {
            throw new Error("Failed to find `s.name = package['name']` in podspec — template may have changed");
          }
          fs.writeFileSync(p, txt);
          console.log(`Rewrote ${p}: hardcoded s.name = 'uniffi-bindgen-react-native'`);
          EOF

      - name: List staged packages
        run: |
          echo "--- runtimes/napi/npm/* ---"
          ls -la runtimes/napi/npm/
          for d in runtimes/napi/npm/*/; do
            echo "--- $d ---"
            cat "$d/package.json"
            echo ""
          done
          echo "--- repo root (publish source for @cenozon/uniffi-bindgen-react-native) ---"
          ls -la .
          echo "--- ./package.json ---"
          cat ./package.json
          echo "--- npm pack --dry-run (what will land in the tarball) ---"
          npm pack --dry-run

      # The `npm publish` invocations use NODE_AUTH_TOKEN sourced from the
      # workflow's own GITHUB_TOKEN. setup-node@v4 above wrote an .npmrc
      # that points the @cenozon scope at https://npm.pkg.github.com and
      # injects NODE_AUTH_TOKEN at publish time.
      - name: Publish platform sub-packages
        working-directory: runtimes/napi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for dir in npm/*/; do
            name="$(basename "$dir")"
            if [ "$name" = "root" ]; then continue; fi
            echo "--- npm publish $dir (tag=snapshot) ---"
            (cd "$dir" && npm publish --tag snapshot --access restricted)
          done

      - name: Publish @cenozon/uniffi-runtime-napi root package
        working-directory: runtimes/napi/npm/root
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish --tag snapshot --access restricted

      # Publish from the repo root, mirroring upstream's `.github/workflows/npm.yml`
      # which just `npm publish`'s from the checkout. The in-place package.json
      # rewrite above is the only diff vs. upstream's flow.
      - name: Publish @cenozon/uniffi-bindgen-react-native
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish --tag snapshot --access restricted

      - name: Append published coords to workflow summary
        env:
          SNAPSHOT_VERSION: ${{ needs.prepare.outputs.snapshot-version }}
        run: |
          {
            echo "## Published packages"
            echo ""
            echo "All published to \`https://npm.pkg.github.com/@cenozon\` with dist-tag \`snapshot\`."
            echo ""
            echo '```json'
            echo "\"@cenozon/uniffi-runtime-napi\": \"${SNAPSHOT_VERSION}\","
            echo "\"@cenozon/uniffi-bindgen-react-native\": \"${SNAPSHOT_VERSION}\""
            echo '```'
            echo ""
            echo "Napi runtime platform sub-packages (loaded via optionalDependencies on the runtime root):"
            echo ""
            echo '```'
            for t in linux-x64-gnu linux-arm64-gnu win32-x64-msvc win32-arm64-msvc darwin-arm64; do
              echo "@cenozon/uniffi-runtime-napi-${t}@${SNAPSHOT_VERSION}"
            done
            echo '```'
            echo ""
            echo "CLI platform sub-packages (loaded via optionalDependencies on @cenozon/uniffi-bindgen-react-native):"
            echo ""
            echo '```'
            for t in linux-x64-gnu linux-arm64-gnu win32-x64-msvc win32-arm64-msvc darwin-arm64; do
              echo "@cenozon/uniffi-bindgen-react-native-cli-${t}@${SNAPSHOT_VERSION}"
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
